[package]
name = "sclang-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Language server for SuperCollider, with no runtime dependency on sclang"

[[bin]]
name = "sclang-lsp"
path = "src/main.rs"

[dependencies]
sclang-index = { path = "../sclang-index" }
sclang-syntax = { path = "../sclang-syntax" }
lsp-server = "0.7"
lsp-types = "0.95"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
