name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # No SuperCollider install anywhere in this job. The suite is hermetic:
      # every test that needs a class library builds one in a temp directory
      # and passes it as `classLibraryPaths`, so the platform defaults are
      # never consulted. That is the layering rule from ARCHITECTURE.md
      # enforced by the CI environment itself.
      - run: cargo test --workspace

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned, not `stable`: each clippy release adds lints, and two of the
      # ones current today would push the MSRV up on code that has not
      # changed. A toolchain bump should be a deliberate commit, not a
      # surprise red build on an unrelated PR.
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      # Strict everywhere. sclang-syntax used to carry three known warnings
      # that made this advisory; they are gone, and the examples are held to
      # the same bar as the crates since they are how the oracles run.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  extension:
    name: vscode extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
        working-directory: editors/vscode

      # Typecheck, then the unit tests. The extension is no longer a thin
      # client: it owns an sclang, and the two pieces of real logic in it —
      # picking the region to evaluate, and reading sclang's error format —
      # are testable without an editor and are covered here.
      #
      # `npm run e2e` is not run. Half of it needs a built server and the other
      # half a SuperCollider install, so it belongs on a developer's machine
      # rather than in this job.
      - run: npm run compile
        working-directory: editors/vscode
      - run: npm test
        working-directory: editors/vscode
