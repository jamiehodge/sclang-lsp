name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `vscode` is the matching VS Code platform, so each server build
          # also produces the extension that carries it.
          - { target: aarch64-apple-darwin,      os: macos-latest,   native: true, vscode: darwin-arm64 }
          - { target: x86_64-apple-darwin,       os: macos-latest,                 vscode: darwin-x64 }
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest,  native: true, vscode: linux-x64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest,  apt: gcc-aarch64-linux-gnu, vscode: linux-arm64 }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest, native: true, vscode: win32-x64 }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Pure Rust with no C dependencies and no build script, so cross
      # compiling needs nothing but a linker. Not linking `sc_lexer` is what
      # buys this.
      - name: Cross linker
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - run: cargo build --release -p sclang-lsp --target ${{ matrix.target }}

      # Prove the artifact actually runs, wherever the runner can execute it.
      # A binary that builds but cannot start is the failure mode worth
      # catching before it reaches a release page.
      - name: Smoke test
        if: matrix.native
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/sclang-lsp
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          "$BIN" --version

      - name: Package
        shell: bash
        run: |
          SRC=target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "sclang-lsp-${{ matrix.target }}.zip" "./$SRC/sclang-lsp.exe" ./LICENSE ./README.md
          else
            tar -czf "sclang-lsp-${{ matrix.target }}.tar.gz" \
              -C "$SRC" sclang-lsp \
              -C "$GITHUB_WORKSPACE" LICENSE README.md
          fi

      # The extension bundles the server, so it is platform specific too and
      # there is one per target. VS Code picks the right one on install, and
      # `--target` is what tells the Marketplace which that is.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci
        working-directory: editors/vscode

      - name: Package the extension
        shell: bash
        working-directory: editors/vscode
        run: |
          npm run compile
          node scripts/bundle-server.js "$GITHUB_WORKSPACE/target/${{ matrix.target }}/release"
          npx vsce package --target ${{ matrix.vscode }} --out "$GITHUB_WORKSPACE/sclang-lsp-${{ matrix.vscode }}.vsix"

      - uses: actions/upload-artifact@v5
        with:
          name: sclang-lsp-${{ matrix.target }}
          path: |
            sclang-lsp-${{ matrix.target }}.*
            sclang-lsp-${{ matrix.vscode }}.vsix
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --repo "$GITHUB_REPOSITORY"
