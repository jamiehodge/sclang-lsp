name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,      os: macos-latest,   native: true }
          - { target: x86_64-apple-darwin,       os: macos-latest }
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest,  native: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest,  apt: gcc-aarch64-linux-gnu }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest, native: true }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Pure Rust with no C dependencies and no build script, so cross
      # compiling needs nothing but a linker. Not linking `sc_lexer` is what
      # buys this.
      - name: Cross linker
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - run: cargo build --release -p sclang-lsp --target ${{ matrix.target }}

      # Prove the artifact actually runs, wherever the runner can execute it.
      # A binary that builds but cannot start is the failure mode worth
      # catching before it reaches a release page.
      - name: Smoke test
        if: matrix.native
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/sclang-lsp
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          "$BIN" --version

      - name: Package
        shell: bash
        run: |
          SRC=target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "sclang-lsp-${{ matrix.target }}.zip" "./$SRC/sclang-lsp.exe" ./LICENSE ./README.md
          else
            tar -czf "sclang-lsp-${{ matrix.target }}.tar.gz" \
              -C "$SRC" sclang-lsp \
              -C "$GITHUB_WORKSPACE" LICENSE README.md
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sclang-lsp-${{ matrix.target }}
          path: sclang-lsp-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --repo "$GITHUB_REPOSITORY"
